{% extends "base.html" %}
{% block title %}Review Quotation{% endblock %}
{% block content %}
<h1>Review Quotation</h1>
<div class="subtitle">Upload an existing quotation (.xlsx) and check it against the standard pricing formula.</div>

<div class="card">
  <div class="upload-zone" id="dropZone">
    <div id="dropText">Drag & drop a quotation .xlsx here, or click to browse</div>
    <input type="file" id="fileInput" accept=".xlsx" style="display:none;">
  </div>
  <div class="grid-2" style="margin-top:16px;">
    <div class="field">
      <label>Country (used to determine per-diem/travel bracket — read from the file's notes if found there)</label>
      <input type="text" id="reviewCountry">
    </div>
    <div class="field">
      <label>Exchange Rate (INR per USD) — only needed if the file does not show its own Exchange rate used line</label>
      <input type="number" id="reviewRate" step="0.01">
    </div>
  </div>
  <button class="btn" id="reviewBtn" disabled>Review Quotation</button>
</div>

<div id="reviewResult"></div>

<script src="{{ url_for('static', filename='review.js') }}"></script>
{% endblock %}
